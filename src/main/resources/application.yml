spring:
  application:
    name: payfabric

  datasource:
    url: jdbc:mysql://localhost:3306/payfabric
    username: payfabric
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080